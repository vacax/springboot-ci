spring.application.name=springboot-ci
# Solo se expone el endpoint de salud; el resto de Actuator queda deshabilitado en la web.
management.endpoints.web.exposure.include=health
# Sondas liveness/readiness para Kubernetes (/actuator/health/liveness y /readiness).
management.endpoint.health.probes.enabled=true
# Nunca devolver trazas de error al cliente.
server.error.include-stacktrace=never
server.error.include-message=never

