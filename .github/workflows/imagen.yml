# Gate 5 — Imagen de contenedor.
#   PR / push: build → trivy config (Dockerfile) → trivy image (CRITICAL/HIGH bloquean) → SBOM.
#   Tags v*:   lo anterior y además push a GHCR → firma keyless con cosign → attestations
#              de procedencia (SLSA) y de SBOM. OIDC (id-token: write) solo existe en ese job.
name: Imagen

on:
  pull_request:
  push:
    branches: [master, devsecops-referencia]
    tags: ['v*']

permissions: {}

env:
  COSIGN_VERSION: v3.1.3

jobs:
  construir-escanear:
    name: Build, escaneo y SBOM
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0   # versión literal: zizmor no puede verificar una expresión

      - name: Escanear configuración (Dockerfile)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL .

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir imagen (sin publicar)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: springboot-ci:escaneo

      - name: Escanear vulnerabilidades (CRITICAL/HIGH bloquean)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed springboot-ci:escaneo

      - name: Generar SBOM (CycloneDX y SPDX)
        run: |
          trivy image --format cyclonedx --output sbom.cdx.json springboot-ci:escaneo
          trivy image --format spdx-json --output sbom.spdx.json springboot-ci:escaneo

      - name: Publicar SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.*.json
          retention-days: 30

  publicar:
    name: Publicar, firmar y atestiguar
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write       # push a GHCR
      id-token: write       # certificado efímero de Fulcio (cosign) y attestations
      attestations: write   # actions/attest
    env:
      IMAGEN: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0   # versión literal: zizmor no puede verificar una expresión

      - name: Instalar cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN }}
          tags: |
            type=ref,event=tag

      # Se construye y escanea ANTES de publicar: lo que se firma es lo que pasó el gate.
      - name: Construir imagen local
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: springboot-ci:escaneo

      - name: Escanear vulnerabilidades (CRITICAL/HIGH bloquean)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed springboot-ci:escaneo

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Mismo builder y mismo contexto: las capas salen del caché local del paso anterior.
      - name: Publicar imagen
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Firmar con cosign (keyless, OIDC de GitHub)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGEN}@${DIGEST}"

      - name: Generar SBOM de la imagen publicada
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: trivy image --format cyclonedx --output sbom.cdx.json "${IMAGEN}@${DIGEST}"

      - name: Attestation de procedencia (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGEN }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attestation del SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGEN }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Resumen
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### Imagen publicada"
            echo '```'
            echo "${IMAGEN}@${DIGEST}"
            echo '```'
            echo "Verificar firma:"
            echo '```'
            echo "cosign verify ${IMAGEN}@${DIGEST} \\"
            echo "  --certificate-identity https://github.com/${REPO}/.github/workflows/imagen.yml@${REF} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo "Verificar procedencia: \`gh attestation verify oci://${IMAGEN}@${DIGEST} -R ${REPO}\`"
          } >> "$GITHUB_STEP_SUMMARY"
