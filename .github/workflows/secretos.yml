# Gate 2 — Detección de secretos con gitleaks.
# Alcance del escaneo según el evento:
#   pull_request        → solo los commits del PR.
#   push                → todo el historial alcanzable desde el commit publicado.
#   schedule / manual   → todas las ramas y tags del repositorio (auditoría completa).
# Se usa el binario oficial (licencia MIT) verificado por checksum, en lugar de gitleaks-action
# (licencia propia desde v2; exige llave para repos de organizaciones).
name: Secretos

on:
  push:
    branches: [master, devsecops-referencia]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar gitleaks (binario verificado)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Escanear commits del PR
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .

      - name: Escanear historial de la rama
        if: github.event_name == 'push'
        env:
          SHA: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --log-opts="--full-history ${SHA}" \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .

      - name: Auditar todo el repositorio
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --log-opts="--full-history --all" \
            --report-format sarif --report-path "$RUNNER_TEMP/gitleaks.sarif" .

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reporte-gitleaks
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 14
