# Gate 4 — SCA. Envía el grafo de dependencias de Gradle a GitHub y, en los PR,
# bloquea si el cambio introduce dependencias con vulnerabilidades altas o críticas.
name: Dependencias

on:
  push:
    branches: [master, devsecops-referencia]
  pull_request:

permissions: {}

jobs:
  dependency-submission:
    name: Enviar grafo de dependencias
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # requerido por la API de dependency submission
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Generar y enviar grafo
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  dependency-review:
    name: Revisión de dependencias
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Revisar dependencias del PR
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # El grafo del PR llega desde el job anterior; se reintenta hasta que GitHub lo procese.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
