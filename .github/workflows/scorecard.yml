# OpenSSF Scorecard: evalúa prácticas de seguridad del repositorio y sube el resultado a Code scanning.
# Nota: scorecard-action solo acepta la rama por defecto o eventos pull_request.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  analisis:
    name: Scorecard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write   # subir SARIF
      id-token: write          # solo se usa al publicar resultados en la API pública de Scorecard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ejecutar Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Publicar solo desde la rama por defecto (requisito del servicio público).
          publish_results: ${{ github.event_name != 'pull_request' }}

      - name: Publicar artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 14

      - name: Subir a Code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
