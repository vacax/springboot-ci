# Gate 7 — El pipeline también es superficie de ataque.
# zizmor revisa los propios workflows: triggers peligrosos (pull_request_target), inyección por
# expresiones ${{ }}, actions sin fijar por SHA, permisos excesivos y credenciales persistidas.
name: Auditoría de workflows

on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [master, devsecops-referencia]
    paths: ['.github/**']

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Auditar workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false   # modo gate: el job falla si hay hallazgos
          annotations: true
          min-severity: medium
          online-audits: false
